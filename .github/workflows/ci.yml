name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t commit-to-cloud:v1 .

  scan:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t commit-to-cloud:v1 .
      - name: Scans the Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: commit-to-cloud:v1
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          format: table
  push:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t commit-to-cloud:v1 .
      - name: Login to Docker Hub
        uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag Docker image
        run: docker tag commit-to-cloud:v1 ${{ secrets.DOCKERHUB_USERNAME }}/commit-to-cloud:v1

      - name: Push the Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/commit-to-cloud:v1
